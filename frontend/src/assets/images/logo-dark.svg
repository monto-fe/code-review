<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none">
  <!-- 图标：放大镜 + 代码标签 -->
  <g transform="translate(0, 2)">
    <!-- 放大镜镜片 -->
    <circle cx="20" cy="20" r="11" stroke="#2c2c2c" stroke-width="2" fill="none"/>
    <!-- 放大镜手柄 -->
    <line x1="28" y1="28" x2="36" y2="36" stroke="#2c2c2c" stroke-width="2" stroke-linecap="round"/>
    <!-- 镜片内代码符号 </> -->
    <text x="20" y="24" text-anchor="middle" fill="#2c2c2c" font-family="ui-monospace, monospace" font-size="10" font-weight="600">&lt;/&gt;</text>
  </g>
  <!-- 文字 -->
  <text x="52" y="18" fill="#2c2c2c" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">GitLab</text>
  <text x="52" y="34" fill="#E24329" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Code Review</text>
</svg>
