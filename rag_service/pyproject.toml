[tool.poetry]
name = "code-review-rag-service"
version = "0.1.0"
description = "基于 RAG 的代码审查服务，支持 GitLab 代码分析和审查建议生成"
authors = ["richLpf <1045465391@qq.com>"]
readme = "README.md"
packages = [{include = "app"}, {include = "rag_engine"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-dotenv = "^1.0.0"
gitpython = "^3.1.40"
langchain = "^0.1.0"
langchain-community = "^0.0.10"
sentence-transformers = "^2.2.2"
faiss-cpu = "^1.7.4"
torch = "2.1.2"
torchvision = "0.16.2"
pydantic = "^2.0.0"
huggingface_hub = "<0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"