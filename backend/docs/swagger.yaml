        type: array
    type: object
  dto.CheckCountResponse:
    properties:
      count:
        type: integer
    type: object
  dto.CommitInfo:
    properties:
      added:
        items:
          type: string
        type: array
      author:
        properties:
          email:
            type: string
          name:
            type: string
        type: object
      id:
        type: string
      message:
        type: string
      modified:
        items:
          type: string
        type: array
      removed:
        items:
          type: string
        type: array
      timestamp:
        type: string
      url:
        type: string
    type: object
  dto.CreateInnerUserRequest:
    properties:
      email:
        type: string
      job:
        type: string
      name:
        type: string
      namespace:
        type: string
      operator:
        type: string
      password:
        type: string
      phone_number:
        type: string
      role_ids:
        items:
          type: integer
        type: array
      user:
        type: string
