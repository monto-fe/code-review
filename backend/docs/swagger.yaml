basePath: /v1
definitions:
  dto.AIMessageCreateRequest:
    properties:
      ai_model:
        description: AI模型
        type: string
      merge_id:
        description: 合并请求ID
        type: integer
      merge_url:
        description: 合并请求URL
        type: string
      project_id:
        description: 项目ID
        type: integer
      result:
        description: AI评论结果
        type: string
      rule:
        description: 规则类型
        type: integer
      rule_id:
        description: 规则ID
        type: integer
    required:
    - ai_model
    - merge_id
    - merge_url
    - project_id
    - result
    - rule
    - rule_id
    type: object
  dto.AIMessageCreateResponse:
    properties:
      comments:
        description: 评论内容
        type: string
      id:
        description: 消息ID
        type: integer
    type: object
  dto.AIMessageItem:
    properties:
      ai_model:
        description: AI模型
        type: string
      checked_by:
        description: 检查人
        type: string
      create_time:
        description: 创建时间
        type: integer
      human_rating:
        description: 人工评分
        type: integer
      id:
        description: 消息ID
        type: integer
      merge_description:
        description: 合并请求描述
        type: string
      merge_id:
        description: 合并请求ID
        type: integer
      merge_url:
        description: 合并请求URL
        type: string
      passed:
        description: 是否通过
        type: integer
      project_id:
        description: 项目ID
        type: integer
      project_name:
        description: 项目名称
        type: string
      project_namespace:
        description: 项目组
        type: string
      remark:
        description: 备注
        type: string
      result:
        description: AI评论结果
        type: string
      rule:
        description: 规则类型
        type: integer
      rule_id:
        description: 规则ID
        type: integer
      status:
        description: 状态
        type: integer
      update_time:
        description: 更新时间
        type: integer
    type: object
  dto.AIMessageListRequest:
    properties:
      current:
        description: 基础参数
        example: 1
        type: integer
      end_date:
        description: 结束日期 (时间戳，秒级别)
        example: 1705680000
        type: integer
      human_ratings:
        description: 人工评分列表，支持多选
        example:
        - 1
        - 2
        items:
          type: integer
        type: array
      id:
        description: 筛选参数
        example: 0
        type: integer
      page_size:
        description: 每页数量
        example: 20
        type: integer
      passed:
        description: 是否通过 -1未通过 1通过
        example: 0
        type: integer
      project_ids:
        description: 项目ID列表，支持多选
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
      project_namespaces:
        description: 项目命名空间列表，支持多选
        example:
        - frontend
        - backend
        items:
          type: string
        type: array
      start_date:
        description: 新增筛选参数
        example: 1703001600
        type: integer
    required:
    - current
    - page_size
    type: object
  dto.AIMessageListResponse:
    properties:
      count:
        description: 总数
        type: integer
      data:
        description: 消息列表
        items:
          $ref: '#/definitions/dto.AIMessageItem'
        type: array
    type: object
  dto.AIMessageUpdateRequest:
    properties:
      human_rating:
        type: integer
      id:
        type: integer
      remark:
        type: string
    required:
    - id
    type: object
  dto.AIProblemCountResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.HumanRatingStat'
        type: array
      period:
        type: string
    type: object
  dto.BotConfig:
    properties:
      bot_name:
        description: 检测机器人名称，必填
        example: 代码审查机器人
        type: string
      bot_prompt:
        description: 机器人提示词，必填
        example: 请仔细审查代码，重点关注安全性和性能问题
        type: string
    required:
    - bot_name
    - bot_prompt
    type: object
  dto.BotReviewRequest:
    properties:
      additional_prompt:
        description: 额外提示词，可选
        example: 请特别关注性能问题
        type: string
      api_url:
        description: API地址，必填
        example: https://api.openai.com/v1
        type: string
      bot_name:
        description: 机器人名称，必填
        example: security_reviewer
        type: string
      code_content:
        description: 代码内容，必填
        example: function test() { ... }
        type: string
      model:
        description: AI模型，必填
        example: gpt-4
        type: string
      type:
        description: AI类型，必填
        example: OpenAI
        type: string
    required:
    - api_url
    - bot_name
    - code_content
    - model
    - type
    type: object
  dto.BotReviewResult:
    properties:
      ai_model:
        description: AI模型
        type: string
      bot_category:
        description: 机器人分类
        type: string
      bot_name:
        description: 机器人名称
        type: string
      create_time:
        description: 创建时间
        type: integer
      result:
        description: 审查结果
        type: string
    type: object
  dto.BotRoleResponse:
    properties:
      category:
        description: 机器人分类
        type: string
      description:
        description: 机器人描述
        type: string
      name:
        description: 机器人名称
        type: string
