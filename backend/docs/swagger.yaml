host: localhost:9000
info:
  contact: {}
  description: Code Review API documentation
  title: Code Review API
  version: "1.0"
paths:
  /v1/ai/check/bot:
    post:
      consumes:
      - application/json
      description: 使用指定的机器人角色对代码进行审查，支持多个内置机器人角色
      parameters:
      - description: JWT认证Token
        in: header
        name: jwt_token
        required: true
        type: string
      - description: 审查请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.BotReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BotReviewResult'
              type: object
      summary: 机器人代码审查
      tags:
      - 机器人审查
  /v1/ai/check/bot/roles:
    get:
      consumes:
      - application/json
      description: 获取系统中所有可用的机器人角色列表
      parameters:
      - description: JWT认证Token
        in: header
        name: jwt_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BotRolesListResponse'
              type: object
      summary: 获取所有机器人角色
      tags:
      - 机器人管理
  /v1/ai/check/bot/roles/{category}:
    get:
      consumes:
      - application/json
      description: 根据指定分类获取机器人角色列表
      parameters:
      - description: JWT认证Token
        in: header
        name: jwt_token
        required: true
        type: string
      - description: 机器人分类
        example: '"安全"'
        in: path
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BotRolesListResponse'
              type: object
      summary: 根据分类获取机器人角色
      tags:
      - 机器人管理
  /v1/ai/check/bot/roles/detail/{bot_name}:
    get:
      consumes:
      - application/json
      description: 获取指定机器人角色的详细信息
      parameters:
      - description: JWT认证Token
        in: header
        name: jwt_token
        required: true
        type: string
      - description: 机器人名称
        example: '"安全审查机器人"'
        in: path
        name: bot_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/infrastructure.BotRole'
              type: object
      summary: 获取机器人角色详情
      tags:
      - 机器人管理
  /v1/ai/check/history:
    get:
      consumes:
      - application/json
      description: 查询手动触发的审核历史记录
      parameters:
      - description: JWT认证Token
        in: header
        name: jwt_token
        required: true
        type: string
      - default: 1
        description: 当前页码
        in: query
        name: current
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - default: 0
        description: 状态筛选：0-全部，1-进行中，2-完成，3-失败
        in: query
        name: status
        type: integer
      - description: 开始日期
        example: "1703001600"
        in: query
        name: start_date
        type: string
      - description: 结束日期
        example: "1705680000"
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ManualCheckHistoryResponse'
              type: object
      summary: 获取手动审核历史
      tags:
      - 手动代码审核
  /v1/ai/check/manual:
