    - name
    - namespace
    - password
    - user
    type: object
  dto.DeleteUserRequest:
    properties:
      id:
        example: 1
        type: integer
      namespace:
        example: default
        type: string
      user:
        example: test
        type: string
    required:
    - id
    - namespace
    - user
    type: object
  dto.GitlabDeleteRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  dto.GitlabTokenProjectListResponse:
    properties:
      data:
        description: Token项目信息列表
        items:
          $ref: '#/definitions/dto.GitlabTokenProjectResponse'
        type: array
    type: object
  dto.GitlabTokenProjectResponse:
    properties:
      id:
        description: Token ID
        type: integer
      name:
        description: Token名称
        type: string
      project_ids:
        description: 项目ID列表
        type: string
    type: object
  dto.HumanRatingStat:
    properties:
      count:
        type: integer
      level:
        type: integer
    type: object
  dto.ManualCheckHistoryItem:
    properties:
      create_time:
        description: 创建时间
        type: integer
      id:
