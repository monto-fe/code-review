        type: integer
      merge_id:
        description: 合并请求ID
        type: integer
      merge_title:
        description: 合并请求标题
        type: string
      project_id:
        description: 项目ID
        type: integer
      project_name:
        description: 项目名称
        type: string
      status:
        description: 状态
        type: integer
      status_text:
        description: 状态文本
        type: string
      update_time:
        description: 更新时间
        type: integer
    type: object
  dto.ManualCheckHistoryResponse:
    properties:
      list:
        description: 任务列表
        items:
          $ref: '#/definitions/dto.ManualCheckHistoryItem'
