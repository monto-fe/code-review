      project_name:
        description: 项目名称
        type: string
      result:
        description: 审核结果
        type: string
      rule_name:
        description: 规则名称
        type: string
      status:
        description: 状态
        type: integer
      update_time:
        description: 更新时间
        type: integer
    type: object
  dto.MergeRequest:
    properties:
